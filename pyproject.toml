[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dfip"
version = "0.1.0"
description = "Decision-focused inference on Modal with validated model-specific acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["modal==1.5.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
dfip = "dfip.cli:main"

[project.urls]
Repository = "https://github.com/superagent-ai/dfip"
Issues = "https://github.com/superagent-ai/dfip/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dfip"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
