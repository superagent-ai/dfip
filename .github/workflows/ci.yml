name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: pytest
      - run: ruff check src tests
      - run: python -m compileall -q src
      - run: dfip --help
      - run: python -m build
      - name: Inspect distribution licenses
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheel = next(Path('dist').glob('*.whl'))
          sdist = next(Path('dist').glob('*.tar.gz'))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              for filename in ('LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/manifest.json'):
                  assert any(name.endswith('/licenses/' + filename) for name in names), filename
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              for filename in ('LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/manifest.json',
                               'scripts/verify_artifacts.py', 'scripts/build_arxiv.py'):
                  assert any(name.endswith('/' + filename) for name in names), filename
          PY
      - name: Smoke test installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dfip-wheel"
          "$RUNNER_TEMP/dfip-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dfip-wheel/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import sys
          import dfip
          from dfip import Client
          from dfip.models import get_model
          assert 'site-packages' in Path(dfip.__file__).parts, dfip.__file__
          assert dfip.__version__ == importlib.metadata.version('dfip')
          assert get_model('liquid').model_id == 'LiquidAI/d1-3B'
          assert Client('liquid')._engine is None
          try:
              Client().predict([])
          except ValueError:
              pass
          else:
              raise AssertionError('Invalid request must fail before a network call')
          assert not any(name in sys.modules for name in ('torch', 'triton', 'transformers'))
          PY
          "$RUNNER_TEMP/dfip-wheel/bin/dfip" --help
          "$RUNNER_TEMP/dfip-wheel/bin/dfip" models
  research-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU analysis dependencies
        run: python -m pip install --require-hashes -r repro/analysis-py312.lock
      - name: Verify archive and regenerate focused inputs
        run: python scripts/verify_artifacts.py --git-history --regenerate
      - name: Check arXiv source package and metadata
        run: python scripts/build_arxiv.py --output "$RUNNER_TEMP/dfip-arxiv"
